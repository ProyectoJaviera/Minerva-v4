# Minerva v2 -- Docker Compose (docs/GUIA_INSTALACION.md y docs/MUDANZA_DOCKER.md).
# PAPER TRADING: nunca ordenes reales.
#
# AISLAMIENTO DE LA v1: este compose es el de la v2 y NO comparte NINGUN nombre con el bot vivo de la v1
# (proyecto `minerva`, contenedor `minerva-minerva-1`, imagen `minerva:local`, volumenes `minerva_data` y
# `minerva_logs`, puerto 8000). Aqui todo lleva `minerva-v3`: el proyecto, la imagen, el contenedor, los
# volumenes y la red estan FIJADOS por nombre, de modo que ni un `-p minerva` ni un COMPOSE_PROJECT_NAME
# heredado del entorno pueden hacer que un comando de la v2 toque los recursos de la v1.
#
# Este compose es la forma recomendada de correr el bot (instalacion nueva: docs/GUIA_INSTALACION.md).
# El puerto por defecto es el 8002 del host y MINERVA_REAL_BOT vale false por defecto: la v2 arranca SIN
# etiquetado del LLM, Telegram, brazo ejecutado, noticias ni push (nunca gasta API ni compite por el token
# de Telegram de la v1). Para encenderlos hay que decirlo a proposito: MINERVA_REAL_BOT=true.
#
# Uso (detalle en docs/USO.md):
#   docker compose up -d               # UN comando: construye la imagen si falta y arranca el bot
#   docker compose ps                  # STATUS debe pasar a "healthy" (~1 min; hasta 5 la primera vez)
#   docker compose logs -f minerva
#
# Variables de este archivo (todas opcionales; se pueden poner en el entorno):
#   MINERVA_PORT      puerto del host (127.0.0.1). Por defecto 8002. El 8000 es del bot de la v1.
#   MINERVA_REAL_BOT  false (por defecto) = SIN etiquetado del LLM, Telegram, brazo ejecutado, noticias
#                     ni push (una instancia de prueba nunca gasta API ni compite por el token).
#                     true = los mismos interruptores que start_bot.ps1 con un bot real.
#   MINERVA_RESTART   `unless-stopped` (por defecto: vuelve solo tras reiniciar Docker o el PC, salvo
#                     que lo hayas detenido a mano) o `no` (instancias de prueba).
#   MINERVA_ENV_FILE  archivo con las credenciales. Por defecto `.env` (fuera de la imagen). NUNCA copies
#                     aqui el `.env` real de la v1.
name: minerva-v3

services:
  minerva:
    build:
      context: .
      dockerfile: Dockerfile
    image: minerva-v3:local
    container_name: minerva-v3-minerva-1
    init: true
    # Por defecto vuelve solo tras reiniciar Docker o el PC (Docker Desktop debe iniciar con Windows: ver
    # docs/MUDANZA_DOCKER.md). Una parada a mano (`docker compose stop`) NO se deshace sola. Docker no
    # reinicia un contenedor "unhealthy" por si mismo: lo avisa la alerta externa (MinervaV3HealthAlert).
    # Las instancias de prueba usan MINERVA_RESTART=no.
    restart: "${MINERVA_RESTART:-unless-stopped}"
    # Las MISMAS variables fijas que scripts/start_bot.ps1 (no dependen de lo que diga el `.env`;
    # el entorno del proceso tiene prioridad sobre el archivo `.env`). Una prueba verifica la paridad.
    #
    # NO se usa `env_file:` a proposito (hallazgo de la prueba real, Fase 7): Compose interpola los `$`
    # de los valores de un env_file, y un hash bcrypt (`$2b$12$...`, el formato de AUTH_PASSWORD_HASH)
    # llega al contenedor MUTILADO (56 caracteres en vez de 60) y el login del dashboard falla. El
    # `.env` se monta de solo lectura en /app/.env y lo lee la aplicacion con el MISMO analizador que
    # en modo nativo.
    environment:
      DATABASE_PATH: /app/data/minerva_estabilidad.db
      LOG_DIR: /app/logs
      AUTO_OPEN_WITHOUT_LLM: "false"
      LOG_LEVEL: INFO
      LLM_LIVE_LABELING_ENABLED: "${MINERVA_REAL_BOT:-false}"
      TELEGRAM_COMMANDS_ENABLED: "${MINERVA_REAL_BOT:-false}"
      PAPER_EXECUTION_ENABLED: "${MINERVA_REAL_BOT:-false}"
      NEWS_COLLECTION_ENABLED: "${MINERVA_REAL_BOT:-false}"
      LESSONS_MEMORY_ENABLED: "false"
      TELEGRAM_PUSH_ENABLED: "${MINERVA_REAL_BOT:-false}"
    ports:
      # Publicado SOLO en loopback: la API nunca queda expuesta a la LAN ni a internet. Dentro del
      # contenedor el proceso escucha en 0.0.0.0 (asi funciona el port-forwarding de Docker); el
      # aislamiento lo da este "127.0.0.1:" del lado del host. El 8002 por defecto NO es el 8000 de la v1.
      - "127.0.0.1:${MINERVA_PORT:-8002}:8000"
    volumes:
      # Volumenes con nombre, NO carpetas del host: SQLite en modo WAL no es fiable sobre el sistema
      # de archivos compartido de Docker Desktop, y asi este compose nunca abre la base real de data/.
      - data:/app/data
      - logs:/app/logs
      # Las credenciales: el `.env` del host, de solo lectura, en la ruta donde la aplicacion lo busca
      # (ver el comentario de `environment`). OJO: si el archivo NO existe, Docker Desktop for Windows
      # crea una CARPETA con ese nombre y el contenedor arranca SIN credenciales y sin avisar
      # (comprobado en la prueba real de la Fase 7; `create_host_path: false` no lo evita ahi). Por eso
      # los scripts de la Fase 7 comprueban que el archivo exista ANTES de llamar a Compose.
      - type: bind
        source: ${MINERVA_ENV_FILE:-.env}
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
      # El registro oficial del veredicto (docs/VEREDICTO_3_6_REGISTRO*.txt) se lee en cada peticion:
      # al crearlo en el host se desbloquean los resultados sin reconstruir la imagen. Solo lectura.
      - ./docs:/app/docs:ro
      # Seccion «Indicadores» (v2, exploratoria): el archivo de historial local
      # (`scripts/update_history_file.py` lo crea en ./history/history_v3.db). Solo lectura: la app lo
      # abre en modo `immutable`. Si la carpeta no existe, la seccion dice como crear el archivo.
      - ./history:/app/history:ro
    healthcheck:
      test: ["CMD", "python", "docker/healthcheck.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s
    # El lifespan cancela tareas y cierra la base de datos: dale tiempo antes del SIGKILL.
    stop_grace_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Los nombres reales de volumenes y red estan FIJADOS (no dependen del nombre del proyecto): ninguno
# puede coincidir con `minerva_data`, `minerva_logs` ni `minerva_default` de la v1.
volumes:
  data:
    name: minerva-v3_data
  logs:
    name: minerva-v3_logs

networks:
  default:
    name: minerva-v3_default
